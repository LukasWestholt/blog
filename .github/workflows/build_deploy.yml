# .github/workflows/build_deploy.yml
name: Build and Deploy

# Set the following GitHub Secrets:
#    SERVER_HOST – the IP or domain of your server
#    SERVER_USER – the username for SSH
#    SERVER_PASSWORD – password (or switch to using key for SSH key-based auth)
#    SERVER_PORT – typically 22
#    SERVER_TARGET – the path on the server where the files should go

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_full_deploy:
        description: 'Trigger deployment of all static files'
        required: false
        default: false
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  server_fingerprint: 'ssh-rsa AAAAB3NzaC1yc2EAAAABIwAAAIEA2zJZx6VkSJC14SILqvzLiR3v8eS0D7Zs7C7771yDwa90UW8JkhK23dk/G8R74kdcWYEOn3kCSr/2rz+UtYThZeWUa5F6BcT/X5Gwh1RAlw5ESxnRr+hiZhYLI7BivVIo5EzecIs0KEojMRUkXI+ClHIcyXBY6grflQFgjZphFMs='

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro project
        run: pnpm build
        env:
          GITHUB_BRANCH: main

      - name: Archive build
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact
          path: dist/

  deploy:
    name: Deploy changed files via SFTP
    runs-on: ubuntu-latest
    needs: [quality, build]
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_full_deploy == 'false' }} # Only run deploy if 'run_full_deploy' input is 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: build-artifact
          path: dist/

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Add server fingerprint to known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ vars.SERVER_HOST }} ${{ env.server_fingerprint }}" >> ~/.ssh/known_hosts

      - name: Deploy changed files via SFTP
        env:
          SFTP_HOST: ${{ vars.SERVER_HOST }}
          SFTP_PORT: ${{ vars.SERVER_PORT }}
          SFTP_USER: ${{ vars.SERVER_USER }}
          SFTP_PASS: ${{ secrets.SERVER_PASSWORD }}
          REMOTE_ROOT: ${{ vars.SERVER_TARGET }}
        run: bash .github/scripts/deploy.sh

  full-deploy:
    name: Deploy all static files via SFTP
    runs-on: ubuntu-latest
    needs: [quality, build]
    if: ${{ github.event.inputs.run_full_deploy == 'true' }}  # Only run full-deploy if 'run_full_deploy' input is 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: build-artifact
          path: dist/

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Add server fingerprint to known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ vars.SERVER_HOST }} ${{ env.server_fingerprint }}" >> ~/.ssh/known_hosts

      - name: Full resync via SFTP
        env:
          SFTP_HOST: ${{ vars.SERVER_HOST }}
          SFTP_PORT: ${{ vars.SERVER_PORT }}
          SFTP_USER: ${{ vars.SERVER_USER }}
          SFTP_PASS: ${{ secrets.SERVER_PASSWORD }}
          REMOTE_ROOT: ${{ vars.SERVER_TARGET }}
          FULL_SYNC: 'true'
        run: bash .github/scripts/deploy.sh
