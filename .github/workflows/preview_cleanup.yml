# .github/workflows/preview_cleanup.yml
#
# Deletes the preview deployment when a PR is merged or closed.

name: Preview Cleanup

on:
  pull_request:
    types: [closed]
    branches:
      - main

concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Sanitize branch name
        id: branch
        run: |
          # Must match preview_deploy.yml's sanitization exactly, since this is
          # what locates the directory to delete. Allowlisted to [a-z0-9-]
          # since this value gets embedded unquoted into the lftp -e string
          # below.
          SAFE=$(echo '${{ github.head_ref }}' \
            | tr '[:upper:]' '[:lower:]' \
            | tr -c 'a-z0-9' '-' \
            | sed -E 's/-+/-/g; s/^-+//; s/-+$//')
          echo "name=$SAFE" >> $GITHUB_OUTPUT

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Remove preview directory via SFTP
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ vars.SERVER_PORT }} ${{ vars.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          lftp -e "rm -rf ${{ vars.SERVER_TARGET }}/preview/${{ steps.branch.outputs.name }}/; exit" \
            sftp://${{ vars.SERVER_USER }}:${{ secrets.SERVER_PASSWORD }}@${{ vars.SERVER_HOST }}:${{ vars.SERVER_PORT }}

      - name: Deactivate GitHub deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "/repos/${{ github.repository }}/deployments" \
            --jq ".[] | select(.environment == \"preview/${{ steps.branch.outputs.name }}\") | .id" \
          | while read -r ID; do
            gh api "/repos/${{ github.repository }}/deployments/$ID/statuses" \
              --method POST -f state="inactive"
          done
